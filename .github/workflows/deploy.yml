name: Build & Deploy
on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Tioo Landing app
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{secrets.STAGING_SSH_HOST}} # IP address of the server you wish to ssh into
          key: ${{secrets.STAGING_SSH_KEY}} # Private or public key of the server
          username: ${{secrets.STAGING_USERNAME}} # User of the server you want to ssh into
     
          script: |
            cd ~/apps/hellotioo.com/source
            git --work-tree=/home/ubuntu/apps/hellotioo.com/source --git-dir=/home/ubuntu/repos/hellotioo.git pull origin staging
            echo 'Deployment successful to digital ocean'
